
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WayFlow iA | Central de Automação Inteligente</title>
    
    <!-- Polyfill essencial para evitar erro de 'process is not defined' -->
    <script>
      window.process = {
        env: {
          API_KEY: ""
        }
      };
    </script>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --brand-orange: #f59e0b;
            --brand-red: #ef4444;
            --brand-purple: #8b5cf6;
            --brand-green: #22c55e;
        }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            scroll-behavior: smooth;
            background-color: #020617;
            margin: 0;
        }
        .mesh-gradient {
            background-color: #020617;
            background-image: 
                radial-gradient(at 0% 0%, rgba(245, 158, 11, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 0%, rgba(239, 68, 68, 0.1) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(139, 92, 246, 0.1) 0px, transparent 50%),
                radial-gradient(at 0% 100%, rgba(34, 197, 94, 0.05) 0px, transparent 50%);
        }
        .gradient-text {
            background: linear-gradient(to right, #f59e0b, #ef4444);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .btn-primary {
            background: linear-gradient(to right, #ea580c, #dc2626);
            transition: all 0.3s ease;
        }
        .btn-primary:hover {
            transform: scale(1.02);
            box-shadow: 0 0 20px rgba(234, 88, 12, 0.3);
        }
        .glass {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
        .glass-dark {
            background: rgba(2, 6, 23, 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 5px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }
    </style>

    <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@^19.2.3",
        "react/": "https://esm.sh/react@^19.2.3/",
        "react-dom": "https://esm.sh/react-dom@^19.2.3",
        "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
        "lucide-react": "https://esm.sh/lucide-react@^0.475.0",
        "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
        "recharts": "https://esm.sh/recharts@^3.6.0",
        "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@^2.43.0"
      }
    }
    </script>
</head>
<body class="mesh-gradient text-slate-200 antialiased min-h-screen">
    <div id="root"></div>
    
    <script>
      window.onerror = function(msg, url, lineNo, columnNo, error) {
        console.error('Fatal Error:', msg, 'at', url, ':', lineNo);
        const root = document.getElementById('root');
        if (root && root.innerHTML === "") {
          root.innerHTML = `<div style="padding: 40px; color: white; text-align: center; font-family: sans-serif;">
            <h2 style="color: #f59e0b;">Erro Crítico de Inicialização</h2>
            <p style="color: #94a3b8;">${msg}</p>
            <p style="font-size: 12px; color: #64748b;">Verifique o console do navegador para mais detalhes.</p>
          </div>`;
        }
        return false;
      };
    </script>

    <script type="module" src="./index.tsx"></script>
</body>
</html>
